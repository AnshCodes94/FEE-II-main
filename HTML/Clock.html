<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clock</title>
    <link rel = "stylesheet" href = "clock.css"/>
</head>
<body>
    <div class = "clock">
        <div id = "date" ></div>
        <div id = "day" ></div>
        <div>
            <span id = "hrs"></span>
            <span id = "min"></span>
            <span id = "sec"></span>
        </div>
    </div>
    <script>
        let hrs = document.getElementById("hrs");
        let min = document.getElementById("min");
        let sec = document.getElementById("sec");
        let date = document.getElementById("date");
        let day = document.getElementById("day");

        const days = ["Sunday", "Monday", "Tuesday", "Wednesday", 
                        "Thursday", "Friday", "Saturday"];

        const months = ["January", "February", "March", "April", "May", "June", "July",
                        "August", "September", "October", "November", "December"];

        setInterval(cbf,1000);

        function cbf(){
            let currentTime = new Date();
            let hh = currentTime.getHours();
            let mm = currentTime.getMinutes();
            let ss = currentTime.getSeconds();
            let dd = currentTime.getDate();
            let month = currentTime.getMonth();
            let dayOfWeek = currentTime.getDay();

            hrs.textContent = `${hh < 10 ? "0" : ""}${hh} :`;
            min.textContent = `${mm < 10 ? "0" : ""}${mm} :`;
            sec.textContent = `${ss < 10 ? "0" : ""}${ss}`;
            date.textContent = `${dd} ${months[month]}`;
            day.textContent = days[dayOfWeek];
        }
    </script>
</body>
</html>
